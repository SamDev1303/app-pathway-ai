name: MARA + Privacy Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Compliance gate enforcement for atlas-ai.
# Philosophy: catch REGRESSIONS (new risk patterns) — not false-positive on
# legitimate "not migration advice" disclaimer copy.
#
# 3 checks (all blocking if triggered):
#   1. fake-identifier-shape — MARN/QEAC/MARA followed by digits that is NOT
#      [PENDING_FROM_UNIMATE] placeholder. Catches fake-credential regressions
#      (lesson learned from P4.5 Wave 0 — MARN 1798425 scaffold was fake).
#   2. affirmative-advice-phrases — narrow phrase list that is ALWAYS wrong
#      (e.g., "your visa will be", "you qualify for PR").
#   3. placeholder-deadline — fails if [PENDING_FROM_UNIMATE] appears in
#      web/src/** on main after 2026-04-28 (7-day grace window for UniMate).

jobs:
  fake-identifier-shape:
    name: No fake MARN/QEAC/MARA identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for registration-shape strings that are NOT placeholder
        run: |
          set +e
          # Pattern: MARN or MARA followed by whitespace + 7 digits (real format)
          # Excludes the placeholder form "[PENDING_FROM_UNIMATE]" and the
          # allowlisted files that reference the shape in educational context.
          HITS=$(grep -rEn "\b(MARN|MARA)[[:space:]]+[0-9]{6,8}\b|\bQEAC[[:space:]]+[A-Z][0-9]+\b|\bABN[[:space:]]+[0-9]{2}[[:space:]]+[0-9]{3}[[:space:]]+[0-9]{3}[[:space:]]+[0-9]{3}\b" web/src \
            --include='*.ts' --include='*.tsx' \
            | grep -v "PENDING_FROM_UNIMATE" \
            | grep -vE "(chat-system-prompt|sop-prompt)\.ts" \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::Fake-identifier-shape regression — found MARN/QEAC/ABN-formatted numbers that are not [PENDING_FROM_UNIMATE] placeholder:"
            echo "$HITS"
            echo ""
            echo "If this is UniMate's REAL registration number, update web/src/lib/content.ts brand.mara_number canonical constant first, and delete this hardcoded reference — always consume via \`brand.*\` re-export."
            exit 1
          fi
          echo "OK — no fake-identifier-shape strings outside allowlist"

  affirmative-advice-phrases:
    name: No migration-advice affirmative phrases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for phrases that are never MARA-safe
        run: |
          set +e
          # Narrow phrase list — each is always advice-giving (no MARA-safe use case).
          # These trigger immediate block. Legitimate uses of "visa" / "migration"
          # in disclaimer copy are NOT matched here.
          FORBIDDEN='your visa will|your PR will|you qualify for (a |the )?(visa|PR|subclass|485)|apply for subclass|we will (lodge|file) your (visa|PR)|your (visa|PR|migration) (will|is likely to|is expected to)|your (visa|PR) (success|approval|outcome)|points test (result|outcome|score)|visa (success|approval) rate|PR (success|approval) rate|after (you get|receiving) your (visa|PR)'
          # Allowlist: LLM system-prompt files (/api/chat, /api/chat-simple, /api/sop)
          # contain negated instructions ("NEVER quote visa success rates") by design —
          # they encode the deflection rules FOR the model. Matching them = false positive.
          HITS=$(grep -rEin "$FORBIDDEN" web/src --include='*.ts' --include='*.tsx' \
            | grep -vE "web/src/app/api/(chat|chat-simple|sop)/route\.ts|web/src/lib/(chat-system-prompt|sop-prompt)\.ts" \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::Affirmative migration-advice phrase detected — these are NEVER MARA-safe regardless of context:"
            echo "$HITS"
            exit 1
          fi
          echo "OK — no affirmative migration-advice phrases found"

  placeholder-deadline:
    name: PENDING_FROM_UNIMATE deadline enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if [PENDING_FROM_UNIMATE] still present after 2026-04-28
        run: |
          set +e
          HITS=$(grep -rn "PENDING_FROM_UNIMATE" web/src --include='*.ts' --include='*.tsx' || true)
          GRACE_DEADLINE=$(date -u -d '2026-04-28 00:00:00Z' +%s 2>/dev/null || date -u -j -f "%Y-%m-%d %H:%M:%S" "2026-04-28 00:00:00" +%s 2>/dev/null)
          NOW=$(date -u +%s)
          if [ -n "$HITS" ] && [ "$NOW" -ge "$GRACE_DEADLINE" ]; then
            echo "::error::MARA/QEAC/ABN placeholder still unreplaced after 2026-04-27 grace deadline:"
            echo "$HITS"
            echo ""
            echo "Request UniMate's real registration numbers + ABN, replace in web/src/lib/content.ts, and remove ALL [PENDING_FROM_UNIMATE] occurrences."
            exit 1
          fi
          if [ -n "$HITS" ]; then
            COUNT=$(echo "$HITS" | wc -l)
            echo "::warning::[PENDING_FROM_UNIMATE] placeholder still present in $COUNT locations — grace window until 2026-04-27 23:59 UTC"
          fi
          echo "OK — placeholder gate honoured"
